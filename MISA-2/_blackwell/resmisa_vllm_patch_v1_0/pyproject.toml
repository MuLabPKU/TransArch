[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resmisa-vllm-patch"
version = "1.1.0"
description = "ResMISA DeepSeek-V3.2 SM100 HOT prefill plugin for vLLM 0.17.0"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["vllm==0.17.0", "tilelang==0.1.7.post3", "ninja"]

[project.entry-points."vllm.general_plugins"]
register_resmisa = "resmisa_vllm_patch.register:register"

[tool.setuptools.packages.find]
include = ["resmisa_vllm_patch*"]

[tool.setuptools.package-data]
"resmisa_vllm_patch.blackwell" = ["csrc/*.cuh", "csrc/*/*.cu", "csrc/*/*.cuh"]
